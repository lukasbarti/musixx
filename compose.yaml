name: musixx

services:
  musixx:
    build: .
    restart: unless-stopped
    ports:
    - "8080:8080"
    volumes:
    - ./data:/app/data
    - ./music:/app/music
    environment:
      MUSIXX_HTTP_PORT: 8080
      MUSIXX_STORAGE_DATABASE_PATH: /app/data/musixx.db
      MUSIXX_LIBRARY_MUSIC_DIR: /app/music
